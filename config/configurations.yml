---
- key: resource_usage
  type: boolean
  category: resource_usage
  default: true
- key: resource_usage.interval
  type: integer
  category: resource_usage
  default: 15
  dependencies:
    - resource_usage
- key: resource_usage.cpu_warning
  type: integer
  category: resource_usage
  default: 75
  dependencies:
    - resource_usage
- key: resource_usage.cpu_critical
  type: integer
  category: resource_usage
  default: 90
  dependencies:
    - resource_usage
- key: resource_usage.memory_warning
  type: integer
  category: resource_usage
  default: 80
  dependencies:
    - resource_usage
- key: resource_usage.memory_critical
  type: integer
  category: resource_usage
  default: 95
  dependencies:
    - resource_usage
- key: resource_usage.disk_warning
  type: integer
  category: resource_usage
  default: 80
  dependencies:
    - resource_usage
- key: resource_usage.disk_critical
  type: integer
  category: resource_usage
  default: 95
  dependencies:
    - resource_usage
- key: scheduler
  type: boolean
  category: system
  default: true
- key: notifications
  type: boolean
  category: features
  default: true
- key: hooks
  type: boolean
  category: features
  default: true
- key: streaming
  type: boolean
  category: features
  default: true
- key: connectivity
  type: boolean
  category: connectivity
  default: true
- key: connectivity.interval
  type: integer
  category: connectivity
  default: 5
  dependencies:
    - connectivity
- key: connectivity.ssh_key.algorithm
  type: string
  category: connectivity
  default: rsa
- key: connectivity.ssh_key.length
  type: integer
  category: connectivity
  default: 2048
- key: jobs.heartbeat_interval
  type: integer
  category: system
  default: 30
- key: jobs.stuck_threshold
  type: integer
  category: system
  default: 300
