name: Continuous Integration

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.288.0
        with:
          ruby-version: 4.0.1
          bundler-cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Prepare database
        env:
          RAILS_ENV: test
          PG_HOST: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: password
        run: |
          bundle exec rails db:create db:prepare --trace
          bundle exec rails database:seed:production --trace
          bundle exec rails assets:precompile

      - name: Test
        env:
          RAILS_ENV: test
          PG_HOST: localhost
        run: bundle exec rspec --format documentation

      - name: Lint Ruby files
        run: bundle exec rubocop --parallel --display-cop-names

      - name: Lint ERB files
        run: yarn herb:lint

      - name: Format ERB files
        run: yarn herb:format:check .

      - name: Check annotations are up to date
        env:
          RAILS_ENV: test
          PG_HOST: localhost
          MISSION_CONTROL: 1
        run: |
          bundle exec annotaterb routes
          bundle exec annotaterb models

          if ! git diff --exit-code config/routes.rb app/; then
            echo "Error: Annotations are out of date. Please run 'annotaterb routes' and 'annotaterb models' and commit the changes."
            git diff config/routes.rb app/
            exit 1
          fi

      - name: Check i18n files are normalized
        run: |
          bundle exec i18n-tasks normalize

          if ! git diff --exit-code config/locales/; then
            echo "Error: i18n files are not normalized. Please run 'i18n-tasks normalize' and commit the changes."
            git diff config/locales/
            exit 1
          fi

      - name: Security vulnerability scan
        run: |
          bundle exec brakeman --no-pager
          bundle exec yarn audit

  integration:
    name: Integration test application
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.288.0
        with:
          ruby-version: 4.0.1
          bundler-cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Run seed integration
        env:
          RAILS_ENV: development
          PG_HOST: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: password
        run: |
          bundle exec rails db:create db:migrate --trace
          bundle exec rails database:seed:production --trace
          bundle exec rails database:seed:development --trace

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a valid version (expected vMAJOR.MINOR.PATCH[-PRE])"
            exit 1
          fi

          VERSION=$(ruby -r ./lib/rsync_ui/version -e 'puts RsyncUI::VERSION')

          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error file=lib/rsync_ui/version.rb::Version in lib/rsync_ui/version.rb (${VERSION}) does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "Version ${VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:master

      - name: Login to Github Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set build metadata
        id: metadata
        run: |
          echo "git-hash=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push app to GitHub Packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            GIT_HASH=${{ steps.metadata.outputs.git-hash }}
            BUILD_DATE=${{ steps.metadata.outputs.build-date }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Update changelog
        run: |
          bin/changelog "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update changelog for ${GITHUB_REF_NAME}" CHANGELOG.md
            git push origin HEAD
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && PRERELEASE="--prerelease"

          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md ${PRERELEASE}
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --verify-tag ${PRERELEASE}
          fi
