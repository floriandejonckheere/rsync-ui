name: Continuous Integration

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.288.0
        with:
          ruby-version: 4.0.1
          bundler-cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Prepare database
        env:
          RAILS_ENV: test
          PG_HOST: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: password
        run: |
          bundle exec rails db:create db:prepare --trace
          bundle exec rails database:seed:production --trace
          bundle exec rails assets:precompile

      - name: Test
        env:
          RAILS_ENV: test
          PG_HOST: localhost
        run: bundle exec rspec --format documentation

      - name: Lint Ruby files
        run: bundle exec rubocop --parallel --display-cop-names

      - name: Lint ERB files
        run: yarn herb:lint

      - name: Format ERB files
        run: yarn herb:format:check .

      - name: Check annotations are up to date
        env:
          RAILS_ENV: test
          PG_HOST: localhost
          MISSION_CONTROL: 1
        run: |
          bundle exec annotaterb routes
          bundle exec annotaterb models

          if ! git diff --exit-code config/routes.rb app/; then
            echo "Error: Annotations are out of date. Please run 'annotaterb routes' and 'annotaterb models' and commit the changes."
            git diff config/routes.rb app/
            exit 1
          fi

      - name: Security vulnerability scan
        run: |
          bundle exec brakeman --no-pager
          bundle exec yarn audit

  integration:
    name: Integration test application
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.288.0
        with:
          ruby-version: 4.0.1
          bundler-cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Run seed integration
        env:
          RAILS_ENV: development
          PG_HOST: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: password
        run: |
          bundle exec rails db:create db:migrate --trace
          bundle exec rails database:seed:production --trace
          bundle exec rails database:seed:development --trace

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:master

      - name: Login to Github Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push app to GitHub Packages
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
